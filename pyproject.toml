[project]
name = "workshop-coimbra"
version = "0.1.0"
description = "Website and materials for the Popylar pRF modelling workshop in Coimbra (November 2026)"
requires-python = ">=3.12"
dependencies = [
    "plotly>=7.1.0",
    "prfmodel[tensorflow]",
]

[dependency-groups]
docs = [
    "jupytext>=1.19.6",
    "myst-nb>=1.4.0",
    "sphinx>=9.1.0",
    "sphinx-book-theme>=1.4.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-polyversion>=3.0.0",
]

[tool.uv]
package = false
default-groups = ["docs"]

[tool.uv.sources]
prfmodel = { git = "https://github.com/popylar-org/prfmodel.git" }
